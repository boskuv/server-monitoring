name: Build and Push Docker Image for Monitoring Service

on:
  push:
    branches: [ dev, main, prod-* ]

env:
  DOCKER_USERNAME: boris24kv
  IMAGE_NAME: boris24kv/monitoring-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract branch name
      id: extract_branch
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        
        # Используем SHA из события push
        EVENT_SHA="${{ github.sha }}"
        SHORT_EVENT_SHA="${EVENT_SHA:0:8}"
        echo "event_sha=$EVENT_SHA" >> $GITHUB_OUTPUT
        echo "short_event_sha=$SHORT_EVENT_SHA" >> $GITHUB_OUTPUT
        
        if [[ "$BRANCH_NAME" == prod-* ]]; then
          echo "is_prod=true" >> $GITHUB_OUTPUT
        else
          echo "is_prod=false" >> $GITHUB_OUTPUT
        fi
        
        echo "Branch: $BRANCH_NAME"
        echo "Event SHA: $EVENT_SHA (short: $SHORT_EVENT_SHA)"

    - name: Determine image tags
      id: tags
      run: |
        CURRENT_DATE=$(date -u +"%Y%m%d%H%M")
        BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
        SHORT_SHA="${{ steps.extract_branch.outputs.short_event_sha }}"
        
        if [[ "$BRANCH_NAME" == prod-* ]]; then
          TAGS="${IMAGE_NAME}:${BRANCH_NAME},${IMAGE_NAME}:latest"
        else
          TAGS="${IMAGE_NAME}:${CURRENT_DATE},${IMAGE_NAME}:${BRANCH_NAME}-${SHORT_SHA}"
        fi
        
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        echo "current_date=$CURRENT_DATE" >> $GITHUB_OUTPUT
      env:
        IMAGE_NAME: ${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          USER_ID=1000
          GROUP_ID=1000

    - name: Print image info
      run: |
        echo "✅ Image pushed successfully"
        echo "👤 Docker Hub user: ${DOCKER_USERNAME}"
        echo "🏷️  Tags: ${{ steps.tags.outputs.tags }}"
        echo "📅 Date: ${{ steps.tags.outputs.current_date }}"
        echo "🌿 Branch: ${{ steps.extract_branch.outputs.branch_name }}"
        echo "🔧 SHA: ${{ steps.extract_branch.outputs.short_event_sha }}"